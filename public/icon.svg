<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Die body -->
  <rect x="106" y="106" width="300" height="300" rx="40" fill="url(#die)" stroke="#cbd5e1" stroke-width="4"/>
  <!-- Dots for 5 (classic yatzy face) -->
  <circle cx="186" cy="186" r="30" fill="#1e293b"/>
  <circle cx="326" cy="186" r="30" fill="#1e293b"/>
  <circle cx="256" cy="256" r="30" fill="#1e293b"/>
  <circle cx="186" cy="326" r="30" fill="#1e293b"/>
  <circle cx="326" cy="326" r="30" fill="#1e293b"/>
